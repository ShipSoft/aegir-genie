[workspace]
name = "aegir-genie"
description = "GENIE neutrino event generation plugin for the aegir simulation framework"
channels = ["https://prefix.dev/ship", "conda-forge"]
platforms = ["linux-64"]
# Enables source dependencies for the (opt-in) multi-package dev workflow
# below; inert for the default environment.
preview = ["pixi-build"]
requires-pixi = ">=0.68"

[dependencies]
# SHiP/HEP packages (prefix.dev/ship + conda-forge)
shipdatamodel = "*"
phlex = ">=0.3.0"
root = ">=6.40"
# phlex/shipdatamodel are C++23 — pull the matching ROOT build variant.
root_cxx_standard = "==23"
# The GENIE event generator, pythia6-hadronization variant (the production
# backend; a pythia8 variant exists for comparison studies). Built against
# C++23 ROOT, so it coexists with phlex in this environment. Its link-time
# dependencies (libxml2, lhapdf, gsl, pythia6, rootegpythia6 — GENIE's
# shared libraries do not record their own dependencies) arrive as run
# dependencies.
genie = { version = ">=3.6.2", build = "pythia6_*" }
random123 = "*"
libjsonnet = "*"
# Geometry service (GeoModel-backed); the geometry analyzer navigates the
# converted Geant4 geometry, so Geant4 is a direct dependency too.
# >=0.3: ship::geometry_thread() and sharedFromFile, shared with aegir's
# geant4_module (issue #11). Keep in lockstep with aegir's pin — the
# unversioned soname means ld.so dedups the library process-wide and the
# first-loaded copy wins.
shipgeometryservice = ">=0.3"
geant4 = ">=11.3"
# Required transitively by GeoModelCore's CMake config
# (find_dependency(Eigen3)); declared explicitly because conda-forge
# geomodel-core does not list it as a runtime dep (as in aegir).
eigen = "*"

# C++ libraries (phlex's cmake config lacks find_dependency for these)
libboost-devel = "*"
tbb-devel = "*"
spdlog = "*"
# GENIE's public headers include log4cpp; declared explicitly (it also
# arrives as a genie run dependency).
log4cpp = "*"
# conda-forge log4cpp 1.1.4 underdeclares its libnsl runtime dependency.
libnsl = "*"

# Build tools
cmake = ">=3.27"
ninja = "*"
cxx-compiler = "*"
genie-splines-ship = ">=3.6.2,<4"

# Developing against unreleased sibling checkouts (same pattern as aegir):
# uncomment locally, never commit uncommented.
#
# [feature.dev]
# channels = [{ channel = "../ship-local-channel", priority = 10 }]
#
# [feature.dev.dependencies]
# shipgeometryservice = { path = "../geometry_service" }

# Static analysis. clang-tidy lives here rather than in [feature.lint] because
# it replays the commands in compile_commands.json and so needs the same
# headers the compiler saw; feature.lint is a separate solve group and could
# drift from them. clang-tools provides clang-tidy but does not depend on the
# clang package that ships clang's own builtin headers (stddef.h and friends),
# and without those every translation unit fails to parse.
clang = "*"
clang-tools = "*"

[environments]
default = { solve-group = "default" }
lint = { features = ["lint"], solve-group = "lint" }

[activation]
scripts = ["activate.sh"]

[tasks]
configure = { cmd = """
cmake -S . -B build -G Ninja \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX \
    -DCMAKE_INSTALL_LIBDIR=lib \
    -DCMAKE_PREFIX_PATH=$CONDA_PREFIX \
""" }
build = { cmd = "cmake --build build -j", depends-on = ["configure"] }
install = { cmd = "cmake --install build", depends-on = ["build"] }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"] }
clean = "rm -rf build"

# Linting / formatting toolchain. prek orchestrates the hooks; the tools come
# from this environment so versions are tracked in pixi.lock and run identically
# everywhere (including NixOS). See .pre-commit-config.yaml.

# Static analysis, mirroring ShipSoft/.github's clang-tidy.yml. `clang-tidy`
# reports the whole tree; `clang-tidy-diff` reports only what CI gates on,
# namely findings on lines you changed relative to main. -source-filter is a
# Python regex (run-clang-tidy is a Python script), unlike the llvm::Regex
# patterns in .clang-tidy. These use TOML literal strings so the backslashes
# survive.
clang-tidy = { cmd = '''
run-clang-tidy -p build -j $(nproc) -quiet \
    -source-filter '^(?!.*(/G__|Dict[.]cxx|/_deps/|/CMakeFiles/)).*' \
    -extra-arg=-isystem$CONDA_PREFIX/include
''', depends-on = ["build"] }
# clang-tidy-diff.py ships with clang-tools but is not on PATH.
clang-tidy-diff = { cmd = '''
git diff --unified=0 --diff-filter=d origin/main HEAD -- '*.cpp' '*.hpp' '*.cxx' '*.h' \
  | python $CONDA_PREFIX/share/clang/clang-tidy-diff.py -p1 -path build -j $(nproc) \
      -quiet -only-check-in-db -extra-arg=-isystem$CONDA_PREFIX/include
''', depends-on = ["build"] }

[feature.lint.dependencies]
prek = "*"
python = ">=3.11"
ruff = "*"
clang-format = "22.*"
codespell = "*"
reuse = "*"
cffconvert = "*"
commitizen = "*"

# Pinned via PyPI: conda-forge's gersemi lags the version the other SHiP
# repos standardised on, and reflows CMake differently.
[feature.lint.pypi-dependencies]
gersemi = "==0.27.7"

[feature.lint.tasks]
lint = "prek run --all-files"
# Install the git hooks and route them through `pixi run` so the conda-provided
# hook tools are on PATH at commit time (required on NixOS, where the tools are
# not runnable without pixi activation).
install-hooks = '''
prek install --hook-type pre-commit --hook-type commit-msg
hooks=$(git rev-parse --git-path hooks)
sed -i 's#"$PREK" hook-impl#pixi run -e lint prek hook-impl#' "$hooks/pre-commit"
sed -i 's#"$PREK" hook-impl#pixi run -e lint prek hook-impl#' "$hooks/commit-msg"
'''
